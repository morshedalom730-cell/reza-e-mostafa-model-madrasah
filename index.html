    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDG57Z-2T1KqzTzF-DuP7Mfk84D2SRPMZ4",
            authDomain: "annur-international-madrasah.firebaseapp.com",
            databaseURL: "https://annur-international-madrasah-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "annur-international-madrasah",
            storageBucket: "annur-international-madrasah.firebasestorage.app",
            messagingSenderId: "85025774102",
            appId: "1:85025774102:web:9f15c8aa9fa59b49f33337"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let universalLogo = localStorage.getItem('m3_logo') || 'https://i.ibb.co.com/jP4YpCjX/annur-logo.jpg';
        let madrasahName = 'REZA-E MUSTAFA D. MODEL MADRASA';
        let resultPublishStatus = 'PUBLISHED'; let resultPublishDatetime = '';
        
        let subjectConfig = [
            { name: 'Al Quran', full: 100, type: 'Main' }, { name: 'Arabic', full: 100, type: 'Main' },
            { name: 'Bangla', full: 100, type: 'Main' }, { name: 'English', full: 100, type: 'Main' },
            { name: 'Mathematics', full: 100, type: 'Main' }
        ];

        let classSubjectConfig = {}; 
        let registeredStudents = JSON.parse(localStorage.getItem('m3_db')) || [];
        let excelStudents = JSON.parse(localStorage.getItem('m3_results')) || [];

        function applyUniversalLogo() { document.querySelectorAll('.universal-logo-target').forEach(img => img.src = universalLogo); }

        function initFirebaseSync() {
            db.ref('m3_settings/logo').on('value', snap => { if (snap.exists()) { universalLogo = snap.val(); applyUniversalLogo(); } });
            db.ref('m3_settings/publishStatus').on('value', snap => { if (snap.exists()) resultPublishStatus = snap.val(); });
            db.ref('m3_settings/publishDatetime').on('value', snap => { if (snap.exists()) resultPublishDatetime = snap.val(); });
            db.ref('m3_settings/classSubjects').on('value', snap => { if (snap.exists()) classSubjectConfig = snap.val(); });
            
            db.ref('m3_students').on('value', snap => {
                if (snap.exists()) { registeredStudents = Object.values(snap.val()); localStorage.setItem('m3_db', JSON.stringify(registeredStudents)); }
                renderPublicStudentSearch();
            });
            db.ref('m3_results').on('value', snap => {
                if (snap.exists()) {
                    const rawData = snap.val(); const uniqueMap = new Map();
                    Object.values(rawData).forEach(item => { if (item && item.id) uniqueMap.set(item.id + "_" + item.class, item); });
                    excelStudents = Array.from(uniqueMap.values()); localStorage.setItem('m3_results', JSON.stringify(excelStudents));
                }
            });
        }

        function showPage(pageId) {
            ['home','result','public-student-search'].forEach(p => { const el = document.getElementById(`page-${p}`); if(el) el.classList.add('hidden'); });
            const activePage = document.getElementById(`page-${pageId}`); if(activePage) activePage.classList.remove('hidden'); window.scrollTo(0,0);
        }

        function isResultAccessible() {
            if (resultPublishStatus === 'UNPUBLISHED') return false;
            if (resultPublishDatetime) { if (new Date().getTime() < new Date(resultPublishDatetime).getTime()) return false; }
            return true;
        }

        function getSubjectGradeInfo(markVal, fullMark) {
            if (markVal === undefined || markVal === null || String(markVal).trim() === '' || String(markVal).trim() === '-') return { lg: '-', gp: '-' };
            const num = parseFloat(markVal); if (isNaN(num)) return { lg: '-', gp: '-' };
            const percentage = parseInt(fullMark) === 50 ? (num * 2) : num;
            if (percentage < 33) return { lg: 'F', gp: '0.0' };
            if (percentage >= 80) return { lg: 'A+', gp: '5.0' }; if (percentage >= 70) return { lg: 'A', gp: '4.0' };
            if (percentage >= 60) return { lg: 'A-', gp: '3.5' }; if (percentage >= 50) return { lg: 'B', gp: '3.0' };
            if (percentage >= 40) return { lg: 'C', gp: '2.0' }; return { lg: 'D', gp: '1.0' };
        }

        function calculateStudentResultStats(marksArray, configArray) {
            let total = 0, mainSum = 0, mainCount = 0, bonus = 0, hasFail = false, anyMarkEntered = false;
            const activeConfig = configArray || subjectConfig;
            
            (marksArray || []).forEach((m, idx) => {
                if (m !== undefined && m !== null && String(m).trim() !== '' && String(m).trim() !== '-') {
                    const num = parseFloat(m);
                    if (!isNaN(num)) {
                        total += num; anyMarkEntered = true;
                        const subject = activeConfig[idx] || { full: 100, type: 'Main' };
                        const percentage = (num / (subject.full||100)) * 100;
                        let gp = 0;
                        if (percentage < 33) { hasFail = true; gp = 0; }
                        else if (percentage >= 80) gp = 5.0; else if (percentage >= 70) gp = 4.0;
                        else if (percentage >= 60) gp = 3.5; else if (percentage >= 50) gp = 3.0;
                        else if (percentage >= 40) gp = 2.0; else if (percentage >= 33) gp = 1.0;

                        if (subject.type === 'Optional') { bonus += Math.max(0, gp - 2.0); } 
                        else { mainSum += gp; mainCount++; }
                    }
                }
            });

            if (!anyMarkEntered) return { total: 0, grade: '-', gpa: '0.00', remarks: 'Pending' };
            if (hasFail || mainCount === 0) return { total: total, grade: 'F', gpa: '0.00', remarks: 'Failed' };

            let finalGpa = (mainSum / mainCount) + bonus;
            if (finalGpa > 5.0) finalGpa = 5.0;

            let grade = 'A+'; let remarks = 'Outstanding';
            if (finalGpa >= 5.0) { grade = 'A+'; remarks = 'Outstanding'; }
            else if (finalGpa >= 4.0) { grade = 'A'; remarks = 'Excellent'; }
            else if (finalGpa >= 3.5) { grade = 'A-'; remarks = 'Very Good'; }
            else if (finalGpa >= 3.0) { grade = 'B'; remarks = 'Good'; }
            else if (finalGpa >= 2.0) { grade = 'C'; remarks = 'Satisfactory'; }
            else if (finalGpa >= 1.0) { grade = 'D'; remarks = 'Needs Improvement'; }
            else { grade = 'F'; remarks = 'Failed'; }

            return { total, grade, gpa: finalGpa.toFixed(2), remarks };
        }

        function renderPublicStudentSearch() {
            const q = document.getElementById('public-search-input') ? document.getElementById('public-search-input').value.toUpperCase().trim() : '';
            const container = document.getElementById('public-student-results');
            if(!container) return; container.innerHTML = ''; if(!q) return;

            const matches = registeredStudents.filter(s => s.id.includes(q) || s.name.includes(q));
            if(matches.length === 0) { container.innerHTML = `<p class="col-span-2 text-center text-slate-500 font-bold text-xs py-4">কোনো শিক্ষার্থী ডাটা পাওয়া যায়নি।</p>`; return; }

            matches.forEach(s => {
                const statusBadge = s.status === 'Deactivated' ? '<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold text-xs"><i class="fa-solid fa-circle-xmark mr-1"></i>Deactivated</span>' : '<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold text-xs"><i class="fa-solid fa-circle-check mr-1"></i>Active</span>';
                container.innerHTML += `
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex items-center gap-4 shadow-sm">
                        <img src="${s.photo || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="w-16 h-16 rounded-full object-cover border-2 border-slate-400">
                        <div class="space-y-1 text-xs">
                            <h4 class="font-bold text-sm text-slate-900">${s.name}</h4>
                            <p class="text-slate-600"><b>Student ID:</b> ${s.id}</p>
                            <p class="text-slate-600"><b>Class:</b> ${s.class}</p>
                            <p class="text-slate-600"><b>Father's Name:</b> ${s.father || '-'}</p>
                            <div class="pt-1">${statusBadge}</div>
                        </div>
                    </div>
                `;
            });
        }

        function searchResult() {
            const id = document.getElementById('search-student-id').value.trim().toUpperCase();
            const cls = document.getElementById('search-student-class').value;
            const ses = document.getElementById('search-student-session').value;
            const exm = document.getElementById('search-student-exam').value;
            const printArea = document.getElementById('printable-area');

            if (!id) { alert('Please enter Student ID!'); return; }

            if(!isResultAccessible()) {
                const timeText = resultPublishDatetime ? `<br><span class="text-xs font-normal">Official Release Schedule: ${new Date(resultPublishDatetime).toLocaleString('en-US')}</span>` : '';
                printArea.classList.remove('hidden');
                printArea.innerHTML = `<div class="bg-amber-100 p-6 rounded-2xl border-2 border-amber-300 text-amber-950 text-center font-bold text-sm shadow-xl max-w-xl mx-auto my-4"><i class="fa-solid fa-clock text-amber-600 text-3xl mb-2 block"></i>Official Results for this examination have not been published yet.${timeText}</div>`;
                return;
            }

            let student = excelStudents.find(s => s.id.toUpperCase() === id && s.class === cls && s.session === ses && s.exam === exm);
            const regS = registeredStudents.find(r => r.id === id);

            if (!student && regS) student = { id: regS.id, name: regS.name, class: regS.class, session: ses, exam: exm, marks: [] };
            if (!student) {
                printArea.classList.remove('hidden');
                printArea.innerHTML = `<div class="bg-white p-6 rounded-2xl text-red-600 text-center font-bold text-sm shadow-xl border border-red-200 max-w-xl mx-auto my-4"><i class="fa-solid fa-circle-exclamation text-2xl text-red-500 mb-2 block"></i>Transcript Not Found! Please verify Student ID, Class, and Session.</div>`;
                return;
            }

            let currentConfig = classSubjectConfig[cls];
            if (!currentConfig || currentConfig.length === 0) { currentConfig = subjectConfig; }

            const studentFather = (regS && regS.father) ? regS.father : 'N/A';
            
            let validSubjects = [];
            currentConfig.forEach((subObj, sIdx) => {
                const markVal = (student.marks && student.marks[sIdx] !== undefined) ? String(student.marks[sIdx]).trim() : '';
                if (markVal !== '' && markVal !== '-') {
                    validSubjects.push({ subObj: subObj, mark: markVal });
                }
            });

            const subjectCount = validSubjects.length;
            const rowPadClass =
                subjectCount <= 6  ? 'py-4 px-4 text-lg md:text-xl font-bold' :
                subjectCount <= 8  ? 'py-3 px-3 text-base md:text-lg font-bold' :
                subjectCount <= 10 ? 'py-2 px-3 text-sm md:text-base font-bold' :
                subjectCount <= 13 ? 'py-1.5 px-2 text-xs md:text-sm font-bold' :
                                     'py-1 px-1.5 text-[11px] md:text-xs font-bold';

            let subjectRowsHTML = '';
            if (subjectCount === 0) {
                subjectRowsHTML = `<tr><td colspan="5" class="py-6 text-center font-bold text-gray-500">No subject marks recorded.</td></tr>`;
            } else {
                validSubjects.forEach(item => {
                    const gradeInfo = getSubjectGradeInfo(item.mark, item.subObj.full);
                    const typeLabel = item.subObj.type === 'Optional' ? ' <span class="text-[10px] bg-amber-100 text-amber-900 px-1.5 py-0.5 rounded font-bold ml-1 font-montserrat">Optional</span>' : '';
                    subjectRowsHTML += `
                        <tr class="border-b border-gray-300 bg-transparent">
                            <td class="${rowPadClass} border-r border-gray-300 text-slate-900">${item.subObj.name}${typeLabel}</td>
                            <td class="${rowPadClass} text-center text-slate-700 w-24 border-r border-gray-300">${item.subObj.full}</td>
                            <td class="${rowPadClass} text-center text-slate-950 w-28 border-r border-gray-300">${item.mark}</td>
                            <td class="${rowPadClass} text-center text-slate-900 w-20 border-r border-gray-300 font-montserrat">${gradeInfo.lg}</td>
                            <td class="${rowPadClass} text-center text-slate-900 w-20 font-montserrat">${gradeInfo.gp}</td>
                        </tr>
                    `;
                });
            }

            const stats = calculateStudentResultStats(student.marks || [], currentConfig);

            const resultHTML = `
                <div id="pdf-export-container" class="a4-print-wrapper mt-4">
                    <div id="target-transcript-a4-node" class="islamic-a4-sheet font-serif-roman text-left bg-white">
                        <div class="blue-inner-border">
                            <img src="${universalLogo}" class="marksheet-large-watermark" alt="Watermark">

                            <div class="relative z-10 w-full flex-grow flex flex-col justify-start">
                                
                                <!-- BISMILLAH CENTERED -->
                                <div class="text-center mb-2">
                                    <h2 class="arabic-calligraphy text-2xl text-slate-800">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h2>
                                </div>
                                
                                <!-- PREMIUM HEADER -->
                                <div class="flex items-center justify-between border-b-2 border-slate-300 pb-3 mb-4">
                                    <div class="flex items-center gap-4 text-left">
                                        <div class="shrink-0">
                                            <img src="${universalLogo}" alt="Logo" class="w-20 h-20 object-contain p-1 border-[3px] border-amber-500 rounded-full shadow-md bg-white">
                                        </div>
                                        <div>
                                            <h1 class="font-brand text-[23px] font-black text-slate-950 tracking-wider uppercase whitespace-nowrap">${madrasahName}</h1>
                                            <p class="text-[11.5px] text-slate-600 font-bold mt-0.5 tracking-widest uppercase">MOHORA, CHANDGAON, CHITTGONG.</p>
                                        </div>
                                    </div>
                                    <div class="text-right flex flex-col items-end justify-center space-y-1.5 pt-1">
                                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=Verified+Result:+${student.id}" class="w-14 h-14 border border-slate-300 rounded p-1 opacity-90 shadow-sm">
                                        <p class="font-montserrat text-[8px] font-black text-slate-700 tracking-widest">VERIFIED</p>
                                    </div>
                                </div>

                                <!-- TAGS FOR EXAM & TRANSCRIPT -->
                                <div class="flex flex-col items-center justify-center space-y-2.5 mb-5 relative z-10">
                                    <div class="bg-amber-100 border border-amber-300 text-amber-900 px-6 py-1.5 rounded-full font-bold text-[11px] uppercase tracking-widest shadow-sm font-montserrat">
                                        ${student.exam || 'ANNUAL EXAMINATION'}
                                    </div>
                                    <div class="bg-slate-800 text-amber-400 px-8 py-2 rounded-lg font-black text-[13px] uppercase tracking-widest shadow-md font-montserrat border-b-4 border-slate-950">
                                        ACADEMIC TRANSCRIPT
                                    </div>
                                </div>

                                <!-- STUDENT INFO GRID -->
                                <div class="student-info-grid mb-4">
                                    <div class="info-item"><span class="label">STUDENT ID</span><span class="value">: ${student.id}</span></div>
                                    <div class="info-item"><span class="label">CLASS</span><span class="value">: ${student.class}</span></div>
                                    <div class="info-item"><span class="label">STUDENT NAME</span><span class="value">: ${student.name}</span></div>
                                    <div class="info-item"><span class="label">SESSION</span><span class="value">: ${student.session || '2026'}</span></div>
                                    <div class="info-item col-span-2"><span class="label">FATHER'S NAME</span><span class="value">: ${studentFather}</span></div>
                                </div>

                                <!-- MARKS TABLE -->
                                <div class="mt-1 flex-grow">
                                    <table class="w-full border-collapse border-2 border-slate-900 rounded-lg overflow-hidden bg-white shadow-sm">
                                        <thead>
                                            <tr class="bg-slate-900 text-amber-400 uppercase text-sm md:text-base font-montserrat tracking-wide">
                                                <th class="py-2.5 px-4 text-left border-r border-slate-700">Course / Subject Title</th>
                                                <th class="py-2.5 px-2 text-center w-24 border-r border-slate-700">Full Marks</th>
                                                <th class="py-2.5 px-2 text-center w-28 border-r border-slate-700">Obtained</th>
                                                <th class="py-2.5 px-2 text-center w-20 border-r border-slate-700">Grade</th>
                                                <th class="py-2.5 px-2 text-center w-20">GP</th>
                                            </tr>
                                        </thead>
                                        <tbody>${subjectRowsHTML}</tbody>
                                    </table>
                                </div>

                                <!-- SUMMARY -->
                                <div class="border-[3px] border-slate-800 p-4 rounded-xl flex justify-between items-center text-sm font-bold text-slate-950 mt-4 bg-slate-50 relative z-10 shadow-sm">
                                    <div class="text-center px-4">
                                        <span class="text-slate-700 block text-[10px] uppercase font-montserrat tracking-wide mb-1">Total Marks</span>
                                        <span class="text-3xl text-amber-700 font-black">${stats.total}</span>
                                    </div>
                                    <div class="text-center border-x-2 border-slate-300 px-8">
                                        <span class="text-slate-700 block text-[10px] uppercase font-montserrat tracking-wide mb-1">GPA</span>
                                        <span class="text-3xl text-slate-900 font-black">${stats.gpa}</span>
                                    </div>
                                    <div class="text-center border-r-2 border-slate-300 pr-8">
                                        <span class="text-slate-700 block text-[10px] uppercase font-montserrat tracking-wide mb-1">Letter Grade</span>
                                        <span class="text-3xl text-slate-900 font-black">${stats.grade}</span>
                                    </div>
                                    <div class="text-right px-4">
                                        <span class="text-slate-700 block text-[10px] uppercase font-montserrat tracking-wide mb-1">Remarks</span>
                                        <span class="text-xl text-slate-900 font-black uppercase">${stats.remarks}</span>
                                    </div>
                                </div>

                                <!-- PREMIUM SIGNATURES (Only 2 sides) -->
                                <div class="pt-16 pb-2 flex justify-between items-end text-xs text-slate-900 font-bold relative z-10 mt-auto px-8">
                                    <div class="text-center">
                                        <div class="w-40 border-t-[2px] border-slate-800 mb-1.5"></div>
                                        <span class="font-montserrat text-[12px] uppercase tracking-wide">Guardian Signature</span>
                                    </div>
                                    <div class="text-center">
                                        <div class="w-40 border-t-[2.5px] border-slate-950 mb-1.5"></div>
                                        <span class="text-slate-950 font-black font-montserrat text-[12px] uppercase tracking-widest">Principal Signature</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            printArea.classList.remove('hidden');
            printArea.innerHTML = resultHTML + `
                <div class="mt-4 no-print max-w-xl mx-auto flex flex-wrap gap-3 justify-center">
                    <button onclick="executeDirectPrint('target-transcript-a4-node', 'portrait')" class="bg-slate-800 hover:bg-slate-900 text-amber-400 font-bold py-3.5 px-8 rounded-xl text-sm shadow-xl transition tracking-wide"><i class="fa-solid fa-print mr-2"></i> Print Transcript</button>
                    <button onclick="executeTranscriptPDFDownload('${student.id}', '${student.name}')" class="bg-amber-600 hover:bg-amber-700 text-slate-950 font-bold py-3.5 px-8 rounded-xl text-sm shadow-xl transition tracking-wide"><i class="fa-solid fa-file-pdf mr-2"></i> Download PDF</button>
                </div>
            `;
            printArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // TABULATION SHEET
        function showClassResultSheet() {
            const cls = document.getElementById('class-result-dropdown').value;
            const ses = document.getElementById('class-session-dropdown').value;
            const exm = document.getElementById('class-exam-dropdown').value;
            const printArea = document.getElementById('printable-area');

            if(!cls) { alert('Select Class!'); return; }
            
            if(!isResultAccessible()) {
                const timeText = resultPublishDatetime ? `<br><span class="text-xs font-normal">Official Release Schedule: ${new Date(resultPublishDatetime).toLocaleString('en-US')}</span>` : '';
                printArea.classList.remove('hidden');
                printArea.innerHTML = `<div class="bg-amber-100 p-6 rounded-2xl border-2 border-amber-300 text-amber-950 text-center font-bold text-sm shadow-xl max-w-xl mx-auto my-4"><i class="fa-solid fa-clock text-amber-600 text-3xl mb-2 block"></i>Official Results for this examination have not been published yet.${timeText}</div>`;
                return;
            }

            const filtered = excelStudents.filter(s => s.class === cls && s.session === ses && s.exam === exm);
            if(filtered.length === 0) { 
                printArea.classList.remove('hidden');
                printArea.innerHTML = `<p class="text-red-600 text-center font-bold text-sm py-6 bg-red-50 rounded-xl border border-red-200 mt-4 max-w-xl mx-auto">No results found for this selection.</p>`; 
                return; 
            }

            filtered.sort((a,b) => parseInt(a.id.replace(/\D/g, '')) - parseInt(b.id.replace(/\D/g, '')));

            let currentConfig = classSubjectConfig[cls] || subjectConfig;

            let thHTML = `
                <tr class="bg-slate-900 text-white uppercase text-[9px] md:text-[10px]">
                    <th class="p-1 border border-slate-700 text-center w-8">SL</th>
                    <th class="p-1 border border-slate-700 text-center w-16">ID</th>
                    <th class="p-1 border border-slate-700 text-left min-w-[80px]">Student Name</th>
            `;
            currentConfig.forEach(sub => { 
                thHTML += `<th class="p-1 border border-slate-700 text-center align-middle leading-tight break-words max-w-[70px]">${sub.name}<br><span class="font-normal normal-case text-[8px] text-amber-300">(${sub.full})</span></th>`; 
            });
            thHTML += `<th class="p-1 border border-slate-700 bg-amber-600 text-slate-900 font-black text-center">Total</th><th class="p-1 border border-slate-700 bg-amber-600 text-slate-900 font-black text-center">GPA</th><th class="p-1 border border-slate-700 bg-amber-600 text-slate-900 font-black text-center">Grade</th></tr>`;

            let rowsHTML = '';
            filtered.forEach((s, idx) => {
                const stats = calculateStudentResultStats(s.marks || [], currentConfig);
                rowsHTML += `<tr class="text-center border-b border-slate-300 even:bg-slate-50 text-[9px] md:text-[10px]"><td class="p-1 border font-bold text-slate-700">${idx + 1}</td><td class="p-1 border font-bold text-slate-950">${s.id}</td><td class="p-1 border text-left font-bold uppercase">${s.name}</td>`;
                currentConfig.forEach((_, sIdx) => { const mVal = (s.marks && s.marks[sIdx] && String(s.marks[sIdx]).trim() !== '') ? s.marks[sIdx] : '-'; rowsHTML += `<td class="p-1 border font-medium text-slate-900">${mVal}</td>`; });
                rowsHTML += `<td class="p-1 border font-extrabold text-amber-700 bg-amber-50">${stats.total}</td><td class="p-1 border font-extrabold text-slate-900 bg-slate-100">${stats.gpa}</td><td class="p-1 border font-extrabold text-slate-900 bg-slate-100">${stats.grade}</td></tr>`;
            });

            const sheetHTML = `
                <div id="target-tabulation-a4-node" class="bg-slate-900 p-2 shadow-lg font-serif-roman mt-4 w-[1123px] min-h-[794px] mx-auto box-border flex flex-col justify-start">
                    <div class="bg-white border-2 border-amber-500 rounded-xl p-6 h-full flex flex-col">
                        <div class="flex items-center justify-between border-b-2 border-slate-300 pb-4 mb-4">
                            <div class="flex items-center gap-4 text-left">
                                <img src="${universalLogo}" class="w-16 h-16 object-contain bg-white p-1 rounded-full border-2 border-amber-500 shadow-md shrink-0">
                                <div>
                                    <h1 class="font-brand text-2xl font-black text-slate-900 uppercase tracking-widest whitespace-nowrap">${madrasahName}</h1>
                                    <p class="text-[10px] text-slate-600 font-bold uppercase tracking-wider mt-1">MOHORA, CHANDGAON, CHITTGONG.</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="bg-slate-900 text-amber-400 px-4 py-1.5 rounded-lg font-black text-[11px] uppercase tracking-wider shadow-md border-b-4 border-slate-950 inline-block">
                                    Tabulation Sheet
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-wrap justify-between items-center gap-2 px-6 py-2.5 bg-slate-100 border-b border-slate-300 text-xs md:text-sm font-bold text-slate-800 mb-2">
                            <span>${exm}</span>
                            <span>Class: <span class="text-amber-700">${cls}</span></span>
                            <span>Session: <span class="text-amber-700">${ses}</span></span>
                            <span>Total Students: <span class="text-amber-700">${filtered.length}</span></span>
                        </div>
                        <div class="p-2 flex-grow">
                            <table class="w-full table-auto border-collapse border border-slate-800 text-[9px] md:text-[10px]"><thead>${thHTML}</thead><tbody>${rowsHTML}</tbody></table>
                        </div>
                    </div>
                </div>
            `;
            printArea.innerHTML = sheetHTML + `<div class="mt-4 no-print max-w-xl mx-auto"><button onclick="executeDirectPrint('target-tabulation-a4-node', 'landscape')" class="bg-slate-800 hover:bg-slate-900 text-amber-400 px-4 py-3.5 rounded-xl font-bold text-sm shadow-lg w-full transition"><i class="fa-solid fa-print mr-2"></i> Print Tabulation Sheet</button></div>`;
            printArea.classList.remove('hidden'); 
            printArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        async function executeTranscriptPDFDownload(studentId, studentName) {
            const container = document.getElementById('pdf-export-container');
            const btn = event.target; const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Generating...';
            window.scrollTo(0, 0);
            try {
                const sheet = document.getElementById('target-transcript-a4-node');
                sheet.style.transform = 'none'; sheet.style.height = '1123px';
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                
                const opt = {
                    margin: 0, 
                    filename: `Transcript_${studentId}_${studentName.replace(/\s+/g, '_')}.pdf`,
                    image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { scale: 2, useCORS: true, windowWidth: 794, windowHeight: 1123 },
                    jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait' }
                };
                await html2pdf().set(opt).from(container).save();
            } finally { btn.innerHTML = origText; }
        }

        // 100% RELIABLE DIRECT PRINT SYSTEM (LOCKS TO 1 PAGE)
        function executeDirectPrint(targetNodeId, orientation) {
            let pageStyle = document.getElementById('dynamic-print-style');
            if (!pageStyle) {
                pageStyle = document.createElement('style');
                pageStyle.id = 'dynamic-print-style';
                document.head.appendChild(pageStyle);
            }
            
            pageStyle.innerHTML = `
                @page { size: A4 ${orientation}; margin: 0mm !important; }
                html, body { height: 100vh !important; max-height: 100vh !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; background: #fff !important; }
                #printable-area { position: absolute !important; top: 0 !important; left: 0 !important; height: 100vh !important; width: 100vw !important; overflow: hidden !important; display: flex !important; justify-content: center !important; align-items: flex-start !important; padding-top: 15px !important; background: #fff !important; }
                #printable-area > div { transform: scale(0.95) !important; transform-origin: top center !important; box-shadow: none !important; border-radius: 0 !important; }
                .no-print { display: none !important; }
            `;

            setTimeout(() => { 
                window.print(); 
                setTimeout(() => { if (pageStyle) pageStyle.innerHTML = ''; }, 1000);
            }, 300);
        }

        window.onload = function() {
            initFirebaseSync();
        };
    </script>
</body>
</html>
