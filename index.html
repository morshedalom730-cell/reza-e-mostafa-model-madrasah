        /* CANONICAL A4 MARKSHEET SYSTEM (NEW BLUE STYLE) */
        .a4-print-wrapper {
            width: 794px; height: 1123px; background-color: #ffffff; margin: 0 auto;
            position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .islamic-a4-sheet {
            width: 794px; min-height: 1123px; background: transparent;
            border: 4px solid #1e3a8a; /* Blue Outer Border */
            padding: 4px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-between; transform-origin: top center;
        }
        .blue-inner-border {
            border: 6px double #1e3a8a; width: 100%; height: 100%; flex-grow: 1;
            padding: 24px 28px; box-sizing: border-box; display: flex; flex-direction: column;
            justify-content: space-between; position: relative;
        }
        .marksheet-large-watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 450px; height: 450px; opacity: 0.10; pointer-events: none; z-index: 1; object-fit: contain;
        }
        
        .blue-inner-border table, .blue-inner-border th, .blue-inner-border td {
            background-color: transparent !important; background: transparent !important;
        }
        .blue-inner-border table { background: rgba(255, 255, 255, 0.85) !important; position: relative; z-index: 10; }

        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
            body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
            body * { visibility: hidden !important; }

            #printable-area { display: block !important; position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; }
            @page { size: A4 landscape; margin: 10mm; }
            .no-print { display: none !important; }
        }

        function compressImage(file, maxWidth = 250, maxHeight = 250, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if(w > h) { if(w > maxWidth) { h *= maxWidth/w; w = maxWidth; } } 
                        else { if(h > maxHeight) { w *= maxHeight/h; h = maxHeight; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        // MARKS ENTRY & CALCULATION
        function calculateStudentResultStats(marksArray) {
            let total = 0; let validCount = 0; let hasFail = false;
            let mainPointsSum = 0; let mainSubjectCount = 0; let optionalBonusPoint = 0;

            if (!marksArray || !Array.isArray(marksArray)) return { total: 0, grade: '-', gpa: '0.00', remarks: 'N/A' };

            marksArray.forEach((m, idx) => {
                if (m !== undefined && m !== null && String(m).trim() !== '' && String(m).trim() !== '-') {
                    const num = parseFloat(m);
                    if (!isNaN(num)) {
                        total += num; validCount++;
                        const fullMark = (subjectConfig[idx] && subjectConfig[idx].full) ? parseInt(subjectConfig[idx].full) : 100;
                        const percentage = fullMark === 50 ? (num * 2) : num;
                        
                        let gp = 0;
                        if (percentage < 33) { hasFail = true; gp = 0; }
                        else if (percentage >= 80) gp = 5.0; else if (percentage >= 70) gp = 4.0;
                        else if (percentage >= 60) gp = 3.5; else if (percentage >= 50) gp = 3.0;
                        else if (percentage >= 40) gp = 2.0; else if (percentage >= 33) gp = 1.0;

                        if (subjectConfig[idx] && subjectConfig[idx].type === 'Optional') {
                            if (gp > 2.0) optionalBonusPoint += (gp - 2.0);
                        } else { mainPointsSum += gp; mainSubjectCount++; }
                    }
                }
            });

            if (validCount === 0) return { total: 0, grade: '-', gpa: '0.00', remarks: 'Pending' };
            if (hasFail || mainSubjectCount === 0) return { total: total, grade: 'F', gpa: '0.00', remarks: 'Failed' };

            let baseGpa = mainPointsSum / mainSubjectCount;
            let finalGpaNum = baseGpa + (optionalBonusPoint / mainSubjectCount);
            if (finalGpaNum > 5.0) finalGpaNum = 5.0;

            let grade = 'A+'; let remarks = 'Outstanding';
            if (finalGpaNum >= 5.0) { grade = 'A+'; remarks = 'Outstanding'; }
            else if (finalGpaNum >= 4.0) { grade = 'A'; remarks = 'Excellent'; }
            else if (finalGpaNum >= 3.5) { grade = 'A-'; remarks = 'Very Good'; }
            else if (finalGpaNum >= 3.0) { grade = 'B'; remarks = 'Good'; }
            else if (finalGpaNum >= 2.0) { grade = 'C'; remarks = 'Satisfactory'; }
            else if (finalGpaNum >= 1.0) { grade = 'D'; remarks = 'Needs Improvement'; }
            else { grade = 'F'; remarks = 'Failed'; }

            return { total: total, grade: grade, gpa: finalGpaNum.toFixed(2), remarks: remarks };
        }

        function getSubjectGradeInfo(markVal, fullMark) {
            if (markVal === undefined || markVal === null || String(markVal).trim() === '' || String(markVal).trim() === '-') return { lg: '-', gp: '-' };
            const num = parseFloat(markVal); if (isNaN(num)) return { lg: '-', gp: '-' };
            const percentage = parseInt(fullMark) === 50 ? (num * 2) : num;
            if (percentage < 33) return { lg: 'F', gp: '0.0' };
            if (percentage >= 80) return { lg: 'A+', gp: '5.0' }; if (percentage >= 70) return { lg: 'A', gp: '4.0' };
            if (percentage >= 60) return { lg: 'A-', gp: '3.5' }; if (percentage >= 50) return { lg: 'B', gp: '3.0' };
            if (percentage >= 40) return { lg: 'C', gp: '2.0' }; return { lg: 'D', gp: '1.0' };
        }

            if (!student && regS) student = { id: regS.id, name: regS.name, class: regS.class, session: ses, exam: exm, marks: [] };

            const studentFather = (regS && regS.father) ? regS.father : 'N/A';
            const subjectCount = subjectConfig.length;
            
            const rowPadClass =
                subjectCount <= 6  ? 'py-4 px-4 text-lg md:text-xl font-bold' :
                subjectCount <= 8  ? 'py-3 px-3 text-base md:text-lg font-bold' :

                subjectCount <= 13 ? 'py-1.5 px-2 text-xs md:text-sm font-bold' :
                                     'py-1 px-1.5 text-[11px] md:text-xs font-bold';

            let subjectRowsHTML = '';

                        <td class="${rowPadClass} text-center text-blue-900 w-20 font-montserrat">${gradeInfo.gp}</td>
                    </tr>
                `;
            });

            const stats = calculateStudentResultStats(student.marks || []);
            const currentDateStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });

            const resultHTML = `
                <div id="pdf-export-container" class="a4-print-wrapper mt-4">

                                        <img src="${universalLogo}" alt="Logo" class="w-20 h-20 object-contain p-1 border-2 border-blue-800 rounded-full shadow-sm">
                                    </div>
                                    <div class="w-3/5 text-center">
                                        <h2 class="arabic-calligraphy text-2xl text-blue-900 mb-1">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</h2>
                                        <h1 class="font-brand text-[22px] font-black text-blue-950 tracking-wide uppercase">${madrasahName}</h1>
                                        <p class="text-[11px] text-blue-800 font-bold mt-1">Kaptai Rastar Matha, Mohara, Chandgaon, Chattogram</p>

                                            ACADEMIC TRANSCRIPT - ${student.exam || 'ANNUAL EXAMINATION'}

                                    <div class="w-1/5 text-right font-montserrat text-xs font-bold text-blue-950 space-y-1.5 pt-4">
                                        <p>Session: <span class="text-red-700">${student.session || '2026'}</span></p>
                                        <p>Date: <span class="text-red-700">${currentDateStr}</span></p>
                                    </div>
                                </div>

                                <!-- STUDENT INFO (NO PHOTO) -->
                                <div class="bg-blue-50/60 border border-blue-200 p-3 rounded-lg flex flex-col gap-2 mb-4">
                                    <div class="grid grid-cols-2 gap-4 text-sm font-bold text-blue-950">
                                        <div class="flex"><span class="w-32 text-gray-600">Student ID</span><span class="mr-2">:</span><span class="uppercase">${student.id}</span></div>
                                        <div class="flex"><span class="w-32 text-gray-600">Class / Level</span><span class="mr-2">:</span><span class="uppercase">${student.class}</span></div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-4 text-sm font-bold text-blue-950">
                                        <div class="flex"><span class="w-32 text-gray-600">Student Name</span><span class="mr-2">:</span><span class="uppercase">${student.name}</span></div>
                                        <div class="flex"><span class="w-32 text-gray-600">Father's Name</span><span class="mr-2">:</span><span class="uppercase">${studentFather}</span></div>
                                    </div>
                                </div>

                                <!-- MARKS TABLE -->
                                <div class="mt-1">
                                    <table class="w-full border-collapse border-2 border-blue-900 rounded-lg overflow-hidden">

                                            <tr class="bg-blue-900 text-white uppercase text-sm md:text-base font-montserrat">
                                                <th class="py-2.5 px-3 text-left border-r border-blue-800">Course / Subject Title</th>

                                                <th class="py-2.5 px-2 text-center w-28 border-r border-blue-800">Marks Obtained</th>
                                                <th class="py-2.5 px-2 text-center w-20 border-r border-blue-800">Grade</th>
                                                <th class="py-2.5 px-2 text-center w-20">GP</th>

                                        </thead>
                                        <tbody>${subjectRowsHTML}</tbody>
                                    </table>
                                </div>

                                <!-- SUMMARY -->
                                <div class="border-2 border-blue-800 p-3 rounded-xl shadow-sm flex justify-between items-center text-sm font-bold text-blue-950 mt-4 bg-white relative z-10">
                                    <div class="text-center px-1">
                                        <span class="text-gray-600 block text-[10px] uppercase font-montserrat">Total Marks</span>
                                        <span class="text-2xl text-amber-700 font-black">${stats.total}</span>
                                    </div>
                                    <div class="text-center border-x-2 border-blue-200 px-4">

            printArea.classList.remove('hidden');
            printArea.innerHTML = resultHTML + `
                <div class="mt-5 no-print max-w-xl mx-auto flex flex-wrap gap-3 justify-center">

                    <button onclick="executeTranscriptPDFDownload('${student.id}', '${student.name}')" class="bg-amber-500 hover:bg-amber-600 text-blue-950 font-bold py-3 px-6 rounded-xl text-sm shadow-md transition flex items-center gap-1.5"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
                </div>
            `;
            printArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

        async function autoFitA4Marksheet(elementId) {
            const sheet = document.getElementById(elementId);
            if (!sheet) return 1;
            sheet.style.transform = 'none'; sheet.style.height = 'auto'; 
            await document.fonts.ready;
            const images = sheet.querySelectorAll('img');
            await Promise.all(Array.from(images).map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => { img.onload = img.onerror = resolve; });
            }));
            const actualHeight = sheet.scrollHeight; const targetHeight = 1123;
            let scale = 1;
            if (actualHeight > targetHeight) { scale = (targetHeight / actualHeight) * 0.985; }
            sheet.style.height = (actualHeight > targetHeight ? actualHeight : targetHeight) + 'px';
            sheet.style.transform = `scale(${scale})`;
            return scale;
        }

        async function executeTranscriptPDFDownload(studentId, studentName) {
            const container = document.getElementById('pdf-export-container');
            const btn = event.target; const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Generating...';
            window.scrollTo(0, 0);
            try {
                await autoFitA4Marksheet('target-transcript-a4-node');
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                const opt = {
                    margin: 0, filename: `Transcript_${studentId}_${studentName.replace(/\s+/g, '_')}.pdf`,
                    image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 794, windowHeight: 1123, scrollY: 0, scrollX: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                await html2pdf().set(opt).from(container).save();
            } finally { btn.innerHTML = origText; }
        }

        async function executeIsolatedTranscriptPrint() {
            const container = document.getElementById('pdf-export-container');
            await autoFitA4Marksheet('target-transcript-a4-node');
            const printFrame = document.getElementById('isolated-print-frame');
            const frameDoc = printFrame.contentWindow.document;
            const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');
            frameDoc.open();
            frameDoc.write(`
                <!DOCTYPE html><html><head><title>Print Transcript</title>
                <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Amiri:wght@700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
                <script src="https://cdn.tailwindcss.com"><\/script>
                ${styles}
                <style>
                    @page { size: A4 portrait; margin: 10mm; }
                    html, body { width: 190mm; height: 277mm; margin: 0 !important; padding: 0 !important; background: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
                    .print-safe-wrap { width: 794px; height: 1123px; transform: scale(0.9); transform-origin: center center; }
                    .a4-print-wrapper { box-shadow: none !important; margin: 0 auto !important; }
                    html, body, .print-safe-wrap, .print-safe-wrap * { visibility: visible !important; }
                    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
                </style>
                </head><body><div class="print-safe-wrap">${container.outerHTML}</div></body></html>
            `);
            frameDoc.close();
            setTimeout(() => { printFrame.contentWindow.focus(); printFrame.contentWindow.print(); }, 1000);
        }

        // SETTINGS
        function saveSettings() {
            const name = document.getElementById('set-madrasah-name').value;
            db.ref('m3_settings/name').set(name); localStorage.setItem('m3_name', name);
            const fileInput = document.getElementById('universal-logo-file');
            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], 250, 250).then(b64 => {
                    db.ref('m3_settings/logo').set(b64); localStorage.setItem('m3_logo', b64);
                    alert('Settings & Logo Saved!'); applyAdminUniversalLogo();
                });
            } else { alert('Madrasah Name Saved!'); }
        }
        function changeAdminPassword() {
            const newPass = document.getElementById('new-admin-pass').value.trim();
            if(newPass) { localStorage.setItem('m3_pass', newPass); alert('Password Updated!'); }
        }
        function clearAllSystemStorageWithPassword() {
            const pass = prompt('Enter Admin Password to WIPE ALL CLOUD DATA:');
            if (pass === (localStorage.getItem('m3_pass') || '1234')) {
                db.ref('m3_students').remove(); db.ref('m3_results').remove();
                registeredStudents = []; excelStudents = [];
                localStorage.removeItem('m3_db'); localStorage.removeItem('m3_results');
                renderStudentDBTable(); renderExcelTable(); alert('All data wiped!');
            }
        }

        window.onload = function() {
            // Keep on login screen initially
        };
    </script>
