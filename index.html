<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - REZA-E MUSTAFA SM. MODEL MADRASA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.13.0/html2pdf.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700;800&family=Montserrat:wght@500;600;700;800;900&family=Cinzel:wght@600;700;800;900&family=Amiri:wght@700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Anek Bangla', sans-serif; background-color: #f0f4f8; }
        .font-brand { font-family: 'Cinzel', serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .arabic-calligraphy { font-family: 'Aref Ruqaa', 'Amiri', serif; letter-spacing: 0px; line-height: 1.5; }
        
        /* A4 ID CARD SYSTEM */
        .id-card-exact-replica { width: 335px; height: 550px; background: #ffffff; position: relative; overflow: hidden; border: 1.5px solid #cbd5e1; box-shadow: 0 16px 35px rgba(0,0,0,0.18); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        .id-top-decor { position: absolute; top: 0; left: 0; width: 100%; height: 48px; pointer-events: none; z-index: 10; }
        .id-bottom-decor { position: absolute; bottom: 0; right: 0; width: 100%; height: 42px; pointer-events: none; z-index: 10; }
        .id-info-watermark-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 155px; height: 155px; opacity: 0.08; pointer-events: none; z-index: 1; object-fit: contain; }
        .id-card-badge-box { border: 2px solid #005a8c; background: #e2e8f0; color: #003865; font-weight: 900; font-size: 15px; letter-spacing: 2px; padding: 3px 22px; display: inline-block; }
        .id-cadet-photo-frame { width: 140px; height: 140px; border: 4px solid #047857; border-radius: 50%; object-fit: cover; margin: 6px auto; display: block; background: #f8fafc; position: relative; z-index: 5; }

        /* TABULATION PRINT SYSTEM */
        .a4-print-wrapper { width: 1123px; min-height: 794px; background-color: #ffffff; margin: 0 auto; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .islamic-a4-sheet { width: 1123px; min-height: 794px; background: #ffffff; border: 12px solid #0f172a; padding: 6px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; transform-origin: top center; }
        .blue-inner-border { border: 2px solid #d97706; outline: 1px solid #d97706; outline-offset: 3px; width: 100%; height: 100%; flex-grow: 1; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; position: relative; background: #fdfdfd; }
        
        @media print {
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
            body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            #printable-area { display: flex !important; justify-content: center; position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; }
            @page { size: A4 landscape; margin: 0mm !important; } 
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-slate-800 selection:text-white">

    <!-- SECURE LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900 px-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full border-t-4 border-amber-500 text-center">
            <div class="w-20 h-20 mx-auto mb-4 bg-slate-100 text-slate-900 rounded-full flex items-center justify-center text-3xl shadow-inner"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">Result System</h2>
            <p class="text-[10px] text-slate-500 mb-6 font-bold uppercase tracking-widest">REZA-E MUSTAFA SM. MODEL MADRASA</p>
            <input type="password" id="login-password" class="w-full p-3.5 border-2 border-slate-200 rounded-xl mb-4 font-bold text-center outline-none focus:border-slate-600" placeholder="Enter Password">
            <button onclick="checkAdminLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-lg tracking-wide">Access Portal</button>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="admin-dashboard" class="hidden flex-grow pb-12">
        <nav class="bg-slate-900 text-white shadow-xl sticky top-0 z-50 no-print border-b-2 border-amber-500">
            <div class="container mx-auto px-4 flex flex-wrap justify-between items-center py-3.5">
                <h1 class="font-bold text-base md:text-lg text-amber-400 font-brand tracking-wider">RMS CLOUD</h1>
                <div class="flex items-center gap-5 text-xs font-bold overflow-x-auto">
                    <button onclick="switchTab('students')" id="tab-students" class="text-amber-400 border-b-2 border-amber-400 pb-1">Students</button>
                    <button onclick="switchTab('marks')" id="tab-marks" class="hover:text-amber-400 pb-1 text-slate-300">Marks Entry</button>
                    <button onclick="switchTab('attendance')" id="tab-attendance" class="hover:text-amber-400 pb-1 text-slate-300">Attendance</button>
                    <button onclick="switchTab('print')" id="tab-print" class="hover:text-amber-400 pb-1 text-slate-300">Results</button>
                    <button onclick="switchTab('settings')" id="tab-settings" class="hover:text-amber-400 pb-1 text-slate-300"><i class="fa-solid fa-gear"></i></button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-4 pt-8 max-w-7xl space-y-6">
            
            <!-- TAB 1: STUDENTS -->
            <div id="sec-students" class="space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
                    <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-5">
                        <h3 class="text-lg font-extrabold text-slate-800"><i class="fa-solid fa-user-plus text-amber-500 mr-2"></i>Student Registration</h3>
                        <span id="total-registered-badge" class="bg-slate-800 text-amber-400 text-xs px-4 py-1.5 rounded-full font-bold shadow">Total: 0</span>
                    </div>
                    <form onsubmit="handleRegisterStudent(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
                        <div class="md:col-span-2"><label class="block font-bold mb-1 text-slate-600">Student Name *</label><input type="text" id="reg-name" required class="w-full p-2.5 border border-slate-300 rounded-xl font-bold uppercase focus:ring-2 focus:ring-slate-400 outline-none"></div>
                        <div class="md:col-span-2"><label class="block font-bold mb-1 text-slate-600">Father's Name *</label><input type="text" id="reg-father" required class="w-full p-2.5 border border-slate-300 rounded-xl font-bold uppercase focus:ring-2 focus:ring-slate-400 outline-none"></div>
                        
                        <div><label class="block font-bold mb-1 text-slate-600">Student ID *</label><input type="text" id="reg-id" required class="w-full p-2.5 border border-slate-300 rounded-xl font-black uppercase text-slate-800 focus:ring-2 focus:ring-slate-400 outline-none"></div>
                        <div>
                            <label class="block font-bold mb-1 text-slate-600">Class / Level *</label>
                            <select id="reg-class" required class="w-full p-2.5 border border-slate-300 rounded-xl bg-slate-50 font-bold text-slate-800 cursor-pointer outline-none">
                                <option value="Nursery">Nursery</option>
                                <option value="Class One">Class One</option>
                                <option value="Class Two">Class Two</option>
                                <option value="Class Three">Class Three</option>
                                <option value="Class Four">Class Four</option>
                                <option value="Class Five">Class Five</option>
                                <option value="Class Six">Class Six</option>
                                <option value="Class Seven">Class Seven</option>
                                <option value="Class Eight">Class Eight</option>
                                <option value="Class Nine">Class Nine</option>
                                <option value="Class Ten">Class Ten</option>
                            </select>
                        </div>
                        <div><label class="block font-bold mb-1 text-slate-600">Mobile Number</label><input type="tel" id="reg-phone" class="w-full p-2.5 border border-slate-300 rounded-xl outline-none"></div>
                        <div>
                            <label class="block font-bold mb-1 text-slate-600">Status</label>
                            <select id="reg-status" class="w-full p-2.5 border border-slate-300 rounded-xl bg-slate-50 font-bold outline-none">
                                <option value="Active" selected>Active</option>
                                <option value="Deactivated">Deactivated</option>
                            </select>
                        </div>
                        <div class="md:col-span-4 flex justify-end mt-2">
                            <button type="submit" id="reg-submit-btn" class="bg-slate-800 text-amber-400 font-bold py-3 px-8 rounded-xl shadow-lg w-full md:w-auto hover:bg-slate-900 transition"><i class="fa-solid fa-check mr-2"></i> Register Student</button>
                        </div>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
                    <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                        <input type="text" id="student-db-search" onkeyup="renderStudentDBTable()" placeholder="Search by ID or Name..." class="p-2.5 border border-slate-300 rounded-xl w-full max-w-sm text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-slate-400">
                        <select id="student-db-search-class" onchange="renderStudentDBTable()" class="p-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 bg-slate-50 outline-none">
                            <option value="ALL" selected>All Classes</option>
                            <option value="Nursery">Nursery</option>
                            <option value="Class One">Class One</option>
                            <option value="Class Two">Class Two</option>
                            <option value="Class Three">Class Three</option>
                            <option value="Class Four">Class Four</option>
                            <option value="Class Five">Class Five</option>
                            <option value="Class Six">Class Six</option>
                            <option value="Class Seven">Class Seven</option>
                            <option value="Class Eight">Class Eight</option>
                            <option value="Class Nine">Class Nine</option>
                            <option value="Class Ten">Class Ten</option>
                        </select>
                    </div>
                    <div class="overflow-x-auto border border-slate-200 rounded-xl">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-800 text-white">
                                    <th class="p-3 border border-slate-700 text-center">SL</th>
                                    <th class="p-3 border border-slate-700">ID</th><th class="p-3 border border-slate-700">Name</th>
                                    <th class="p-3 border border-slate-700">Father's Name</th><th class="p-3 border border-slate-700">Class</th>
                                    <th class="p-3 border border-slate-700">Mobile</th><th class="p-3 border border-slate-700">Status</th>
                                    <th class="p-3 border border-slate-700 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="student-db-table-body" class="bg-white"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TAB 2: MARKS ENTRY -->
            <div id="sec-marks" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200 space-y-5">
                    <div class="flex flex-wrap justify-between items-center border-b border-slate-200 pb-3 gap-2">
                        <h3 class="text-lg font-extrabold text-slate-800"><i class="fa-solid fa-file-excel text-green-600 mr-2"></i>Results & Marks Entry</h3>
                        <div class="flex gap-2">
                            <button onclick="addSubjectColumn()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs px-4 py-2.5 rounded-xl font-bold shadow transition"><i class="fa-solid fa-plus mr-1"></i> Add Subject</button>
                            <button onclick="syncRegisteredStudentsToResults()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl font-bold shadow transition"><i class="fa-solid fa-rotate mr-1"></i> Sync Students</button>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 md:grid-cols-3 gap-4 text-xs">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Select Class:</label>
                            <select id="admin-global-class" onchange="renderExcelTable()" class="w-full p-2.5 border border-slate-300 rounded-xl font-bold bg-white text-slate-900 outline-none">
                                <option value="Nursery">Nursery</option>
                                <option value="Class One">Class One</option>
                                <option value="Class Two">Class Two</option>
                                <option value="Class Three">Class Three</option>
                                <option value="Class Four">Class Four</option>
                                <option value="Class Five">Class Five</option>
                                <option value="Class Six">Class Six</option>
                                <option value="Class Seven">Class Seven</option>
                                <option value="Class Eight">Class Eight</option>
                                <option value="Class Nine">Class Nine</option>
                                <option value="Class Ten">Class Ten</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Session:</label>
                            <select id="admin-global-session" class="w-full p-2.5 border border-slate-300 rounded-xl font-bold bg-white text-slate-900 outline-none">
                                <option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option>
                                <option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Exam Term:</label>
                            <select id="admin-global-exam" class="w-full p-2.5 border border-slate-300 rounded-xl font-bold bg-white text-slate-900 outline-none">
                                <option value="Monthly Examination">Monthly Examination</option>
                                <option value="1st Term Examination">1st Term Examination</option>
                                <option value="Half Yearly Examination">Half Yearly Examination</option>
                                <option value="2nd Term Examination">2nd Term Examination</option>
                                <option value="Annual Examination" selected>Annual Examination</option>
                            </select>
                        </div>
                    </div>

                    <div class="overflow-x-auto border border-slate-300 rounded-xl mb-4 shadow-sm">
                        <table class="w-full text-left border-collapse text-[10px] md:text-[11px]">
                            <thead><tr id="excel-header-row" class="bg-slate-800 text-white"></tr></thead>
                            <tbody id="excel-table-body" class="bg-white"></tbody>
                        </table>
                    </div>
                    <button onclick="saveExcelData()" class="bg-green-700 hover:bg-green-800 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg w-full md:w-auto transition"><i class="fa-solid fa-floppy-disk mr-2"></i> Save Results to Cloud</button>
                </div>
            </div>

            <!-- TAB: ATTENDANCE (NEW FEATURE) -->
            <div id="sec-attendance" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
                    <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-5">
                        <h3 class="text-lg font-extrabold text-slate-800"><i class="fa-solid fa-clipboard-user text-amber-500 mr-2"></i>Monthly Attendance Register</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-sm">
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Select Class *</label>
                            <select id="attendance-class" class="p-3 border border-slate-300 rounded-xl w-full bg-slate-50 font-bold text-slate-900 outline-none">
                                <option value="Nursery">Nursery</option>
                                <option value="Class One">Class One</option>
                                <option value="Class Two">Class Two</option>
                                <option value="Class Three">Class Three</option>
                                <option value="Class Four">Class Four</option>
                                <option value="Class Five">Class Five</option>
                                <option value="Class Six">Class Six</option>
                                <option value="Class Seven">Class Seven</option>
                                <option value="Class Eight">Class Eight</option>
                                <option value="Class Nine">Class Nine</option>
                                <option value="Class Ten">Class Ten</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 mb-1">Month Name *</label>
                            <input type="text" id="attendance-month" placeholder="e.g. January 2026" class="p-3 border border-slate-300 rounded-xl w-full font-bold text-slate-900 outline-none focus:ring-2 focus:ring-slate-400">
                        </div>
                    </div>
                    <button onclick="generateAttendanceSheet()" class="w-full max-w-md mx-auto block bg-slate-800 text-amber-400 py-3.5 rounded-xl text-sm font-bold shadow-lg hover:bg-slate-900 transition tracking-wide">Generate Attendance Register</button>
                </div>
            </div>

            <!-- TAB 3: PRINT RESULTS -->
            <div id="sec-print" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
                    <div class="flex justify-center space-x-3 border-b border-slate-200 pb-5 mb-6 no-print">
                        <button onclick="toggleResultTab('class')" id="tab-btn-class" class="bg-slate-800 text-amber-400 px-6 py-2.5 rounded-xl text-sm font-bold shadow transition">Tabulation Sheet</button>
                    </div>

                    <!-- Class Print -->
                    <div id="result-view-class" class="no-print">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 max-w-2xl mx-auto text-xs md:text-sm">
                            <div>
                                <label class="block font-bold text-slate-600 mb-1">Class *</label>
                                <select id="class-result-dropdown" class="p-3 border border-slate-300 rounded-xl w-full bg-slate-50 font-bold text-slate-900 outline-none">
                                    <option value="Nursery">Nursery</option><option value="Class One">Class One</option>
                                    <option value="Class Two">Class Two</option><option value="Class Three">Class Three</option>
                                    <option value="Class Four">Class Four</option><option value="Class Five">Class Five</option>
                                    <option value="Class Six">Class Six</option><option value="Class Seven">Class Seven</option>
                                    <option value="Class Eight">Class Eight</option><option value="Class Nine">Class Nine</option>
                                    <option value="Class Ten">Class Ten</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-600 mb-1">Session *</label>
                                <select id="class-session-dropdown" class="p-3 border border-slate-300 rounded-xl w-full bg-slate-50 font-bold text-slate-900 outline-none">
                                    <option value="2025">2025</option><option value="2026" selected>2026</option><option value="2027">2027</option>
                                    <option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option>
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-600 mb-1">Exam Term *</label>
                                <select id="class-exam-dropdown" class="p-3 border border-slate-300 rounded-xl w-full bg-slate-50 font-bold text-slate-900 outline-none">
                                    <option value="Monthly Examination">Monthly Examination</option>
                                    <option value="1st Term Examination">1st Term Examination</option>
                                    <option value="Half Yearly Examination">Half Yearly Examination</option>
                                    <option value="2nd Term Examination">2nd Term Examination</option>
                                    <option value="Annual Examination" selected>Annual Examination</option>
                                </select>
                            </div>
                        </div>
                        <button onclick="showClassResultSheet()" class="w-full max-w-md mx-auto block bg-slate-800 text-amber-400 py-3.5 rounded-xl text-sm font-bold shadow-lg hover:bg-slate-900 transition tracking-wide">Generate Tabulation Sheet</button>
                    </div>
                </div>
            </div>

            <!-- TAB 4: SETTINGS -->
            <div id="sec-settings" class="hidden space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
                        <h3 class="text-base font-bold text-slate-800 border-b border-slate-200 pb-3 mb-5">Madrasah Details & Logo</h3>
                        <div class="space-y-4 text-sm">
                            <div>
                                <label class="block font-bold mb-1 text-slate-700">Madrasah Name</label>
                                <input type="text" id="set-madrasah-name" class="w-full p-3 border border-slate-300 rounded-xl font-bold text-slate-900 bg-slate-50" value="REZA-E MUSTAFA D. MODEL MADRASA" title="Edit to change globally">
                            </div>
                            <div>
                                <label class="block font-bold mb-1 text-slate-700">Universal Logo Image</label>
                                <div class="flex items-center gap-4">
                                    <img id="admin-logo-preview" src="" class="universal-logo-target w-16 h-16 object-contain border-2 border-slate-200 rounded-xl bg-white p-1">
                                    <input type="file" id="universal-logo-file" accept="image/*" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs font-medium">
                                </div>
                            </div>
                            <button onclick="saveSettings()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 w-full py-3 rounded-xl font-bold text-sm shadow-md transition mt-2">Save Settings</button>
                        </div>
                    </div>
                    
                    <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
                        <h3 class="text-base font-bold text-slate-800 border-b border-slate-200 pb-3 mb-5">Security & Update</h3>
                        <div class="space-y-4 text-sm">
                            <div>
                                <label class="block font-bold mb-1 text-slate-700">Change Panel Password</label>
                                <input type="password" id="new-admin-pass" placeholder="New Admin Password" class="w-full p-3 border border-slate-300 rounded-xl font-bold outline-none focus:ring-2 focus:ring-blue-400">
                            </div>
                            <button onclick="changeAdminPassword()" class="bg-slate-700 hover:bg-slate-800 text-white w-full py-3 rounded-xl font-bold shadow transition">Update Password</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DYNAMIC PRINT AREA -->
            <div id="printable-area" class="mt-4 hidden no-print"></div>
        </div>
    </div>

    <!-- STUDENT EDIT MODAL POPUP -->
    <div id="student-edit-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden no-print backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-4 border-[3px] border-slate-800">
            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                <h3 class="font-bold text-slate-900 text-base"><i class="fa-solid fa-pen-to-square text-amber-500 mr-2"></i>Edit Student Data</h3>
                <button onclick="closeStudentEditModal()" class="text-red-600 font-bold text-2xl hover:text-red-800 leading-none">&times;</button>
            </div>
            <form onsubmit="saveEditedStudentData(event)" class="space-y-3 text-xs">

        function compressImage(file, maxWidth = 250, maxHeight = 250, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if(w > h) { if(w > maxWidth) { h *= maxWidth/w; w = maxWidth; } } else { if(h > maxHeight) { w *= maxHeight/h; h = maxHeight; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        // MARKS ENTRY & CALCULATION
        function calculateStudentResultStats(marksArray, configArray) {
            let total = 0; let validCount = 0; let hasFail = false;
            let mainPointsSum = 0; let mainSubjectCount = 0; let optionalBonusPoint = 0;

            if (!marksArray || !Array.isArray(marksArray)) return { total: 0, grade: '-', gpa: '0.00', remarks: 'N/A' };

            marksArray.forEach((m, idx) => {
                if (m !== undefined && m !== null && String(m).trim() !== '' && String(m).trim() !== '-') {
                    const num = parseFloat(m);
                    if (!isNaN(num)) {
                        total += num; validCount++;
                        const fullMark = (configArray[idx] && configArray[idx].full) ? parseInt(configArray[idx].full) : 100;
                        const percentage = fullMark === 50 ? (num * 2) : num;
                        
                        let gp = 0;
                        if (percentage < 33) { hasFail = true; gp = 0; }
                        else if (percentage >= 80) gp = 5.0; else if (percentage >= 70) gp = 4.0;
                        else if (percentage >= 60) gp = 3.5; else if (percentage >= 50) gp = 3.0;
                        else if (percentage >= 40) gp = 2.0; else if (percentage >= 33) gp = 1.0;

                        if (configArray[idx] && configArray[idx].type === 'Optional') {
                            if (gp > 2.0) optionalBonusPoint += (gp - 2.0);
                        } else { mainPointsSum += gp; mainSubjectCount++; }
                    }
                }
            });

            if (validCount === 0) return { total: 0, grade: '-', gpa: '0.00', remarks: 'Pending' };
            if (hasFail || mainSubjectCount === 0) return { total: total, grade: 'F', gpa: '0.00', remarks: 'Failed' };

            let baseGpa = mainPointsSum / mainSubjectCount;
            let finalGpaNum = baseGpa + (optionalBonusPoint / mainSubjectCount);
            if (finalGpaNum > 5.0) finalGpaNum = 5.0;

            let grade = 'A+'; let remarks = 'Outstanding';
            if (finalGpaNum >= 5.0) { grade = 'A+'; remarks = 'Outstanding'; }
            else if (finalGpaNum >= 4.0) { grade = 'A'; remarks = 'Excellent'; }
            else if (finalGpaNum >= 3.5) { grade = 'A-'; remarks = 'Very Good'; }
            else if (finalGpaNum >= 3.0) { grade = 'B'; remarks = 'Good'; }
            else if (finalGpaNum >= 2.0) { grade = 'C'; remarks = 'Satisfactory'; }
            else if (finalGpaNum >= 1.0) { grade = 'D'; remarks = 'Needs Improvement'; }
            else { grade = 'F'; remarks = 'Failed'; }

            return { total: total, grade: grade, gpa: finalGpaNum.toFixed(2), remarks: remarks };
        }

        function syncRegisteredStudentsToResults(showAlert = true) {
            registeredStudents.forEach(reg => {
                const existing = excelStudents.find(s => s.id === reg.id);
                // Assign correct subject length based on class
                let clsConfig = classSubjectConfig[reg.class] ? classSubjectConfig[reg.class] : subjectConfig;
                let targetLen = clsConfig.length;
                
                if (!existing) {
                    excelStudents.push({ id: reg.id, name: reg.name, class: reg.class, session: '2026', exam: 'Annual Examination', marks: new Array(targetLen).fill('') });
                } else { 
                    existing.name = reg.name; 
                    existing.class = reg.class; 
                    if (!existing.marks) existing.marks = [];
                    while(existing.marks.length < targetLen) existing.marks.push('');
                }
            });
            renderExcelTable(); if(showAlert) alert('Synced Cadets to Results Board!');
        }

        function renderExcelTable() {
            const cls = document.getElementById('admin-global-class').value;

            if(!headerRow || !tbody) return;
            const currentStudents = excelStudents.filter(s => s.class === cls);
            
            // Sort by ID naturally
            currentStudents.sort((a,b) => parseInt(a.id.replace(/\D/g, '')) - parseInt(b.id.replace(/\D/g, '')));

            // Create precise subject config for this class if it doesn't exist
            if (!classSubjectConfig[cls]) { classSubjectConfig[cls] = [...subjectConfig]; }
            let activeConfig = classSubjectConfig[cls];

            let headerHTML = `<th class="p-1 border border-slate-700 w-8 text-center">SL</th><th class="p-1 border border-slate-700 w-12 text-center">ID</th><th class="p-1 border border-slate-700 w-32">Name</th>`;
            activeConfig.forEach((subObj, sIdx) => {
                headerHTML += `<th class="p-1 border border-slate-700 bg-slate-700 text-center min-w-[70px] max-w-[90px]">
                    <div class="space-y-1">
                        <div class="flex justify-between gap-1"><input type="text" value="${subObj.name}" class="sub-header-input bg-slate-900 text-amber-300 font-bold p-1 rounded w-full border border-slate-600 text-center text-xs" data-idx="${sIdx}"><button onclick="removeSubjectColumn(${sIdx})" class="text-red-400 hover:text-red-200 font-bold px-0.5 text-xs">×</button></div>
                        <div class="flex gap-1">
                            <select onchange="updateSubjectFullMark(${sIdx}, this.value)" class="bg-slate-900 text-white font-bold p-0.5 rounded text-[9px] w-1/2 cursor-pointer border border-slate-600"><option value="100" ${subObj.full==100?'selected':''}>100 M</option><option value="50" ${subObj.full==50?'selected':''}>50 M</option></select>
                            <select onchange="updateSubjectType(${sIdx}, this.value)" class="bg-slate-900 text-amber-100 font-bold p-0.5 rounded text-[9px] w-1/2 cursor-pointer border border-slate-600"><option value="Main" ${subObj.type === 'Main' ? 'selected' : ''}>Main</option><option value="Optional" ${subObj.type === 'Optional' ? 'selected' : ''}>Opt.</option></select>
                        </div>
                    </div></th>`;
            });
            headerHTML += `<th class="p-1 border border-slate-700 bg-amber-600 text-slate-950 text-center w-10">Total</th><th class="p-1 border border-slate-700 bg-amber-600 text-slate-950 text-center w-10">GPA</th><th class="p-1 border border-slate-700 text-center w-8 bg-red-800">Del</th>`;
            headerRow.innerHTML = headerHTML; tbody.innerHTML = '';

            if (currentStudents.length === 0) { tbody.innerHTML = `<tr><td colspan="${5 + activeConfig.length}" class="p-4 text-center font-bold text-gray-500">No students found in ${cls}. Sync first.</td></tr>`; return; }

            currentStudents.forEach((s, idx) => {
                const realIndex = excelStudents.indexOf(s);
                const stats = calculateStudentResultStats(s.marks || [], activeConfig);
                let rowHTML = `<tr class="border-b border-gray-300 hover:bg-slate-100"><td class="p-0 border border-gray-300 text-center font-bold text-slate-700">${idx+1}</td><td class="p-0 border border-gray-300"><input type="text" value="${s.id}" readonly class="ex-id w-full p-1 font-bold text-center bg-transparent uppercase text-slate-950"></td><td class="p-0 border border-gray-300"><input type="text" value="${s.name}" readonly class="ex-name w-full p-1 font-bold bg-transparent uppercase"></td>`;
                activeConfig.forEach((_, sIdx) => {
                    const markVal = (s.marks && s.marks[sIdx] !== undefined) ? s.marks[sIdx] : '';
                    // ENTER KEY EVENT ADDED
                    rowHTML += `<td class="p-0 border border-gray-300"><input type="text" value="${markVal}" onkeydown="handleEnterNavigation(event, ${sIdx}, ${idx})" class="ex-mark sub-mark-${sIdx} row-idx-${idx} w-full p-1.5 text-center font-bold text-slate-900 bg-transparent focus:bg-amber-50 focus:outline-none"></td>`;
                });
                rowHTML += `<td class="p-1 border border-gray-300 text-center font-black text-amber-700 bg-amber-50">${stats.total}</td><td class="p-1 border border-gray-300 text-center font-black text-slate-900 bg-slate-100">${stats.gpa}</td><td class="p-1 border border-gray-300 text-center"><button onclick="deleteExcelRow(${realIndex})" class="text-red-600 hover:text-red-800 font-bold p-1"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                tbody.innerHTML += rowHTML;
            });
        }

        // NAVIGATION LOGIC FOR ENTER KEY
        function handleEnterNavigation(e, colIdx, rowIdx) {
            if (e.key === 'Enter' || e.key === 'ArrowDown') {
                e.preventDefault(); 
                const nextRowInput = document.querySelector(`.sub-mark-${colIdx}.row-idx-${rowIdx + 1}`);
                if (nextRowInput) { nextRowInput.focus(); nextRowInput.select(); }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault(); 
                const prevRowInput = document.querySelector(`.sub-mark-${colIdx}.row-idx-${rowIdx - 1}`);
                if (prevRowInput) { prevRowInput.focus(); prevRowInput.select(); }
            }
        }

                excelStudents.forEach(s => { if(s.class === cls && s.marks) s.marks.splice(subIdx, 1); });
                
                db.ref('m3_settings/classSubjects').set(classSubjectConfig);

        function deleteExcelRow(realIdx) {
            if (confirm('Delete this result row? (Remember to delete from "Students" tab too, or they will sync back!)')) {
                const removedStudent = excelStudents.splice(realIdx, 1)[0];
                try{ localStorage.setItem('m3_results', JSON.stringify(excelStudents)); }catch(e){}
                
                const updates = {}; excelStudents.forEach(item => { if(item.id) updates[item.id] = item; });
                db.ref('m3_results').set(updates).then(() => {
                    renderExcelTable();
                });
            }
        }

        function saveExcelData(showAlert = true) {
            const cls = document.getElementById('admin-global-class').value;
            const exm = document.getElementById('admin-global-exam').value;
            const ses = document.getElementById('admin-global-session').value;
            
            document.querySelectorAll('.sub-header-input').forEach((input, i) => { if(classSubjectConfig[cls][i]) classSubjectConfig[cls][i].name = input.value.trim(); });
            db.ref('m3_settings/classSubjects').set(classSubjectConfig);

            const otherClassStudents = excelStudents.filter(s => s.class !== cls);
            const updatedCurrent = [];
            
            document.querySelectorAll('#excel-table-body tr.spreadsheet-row').forEach(row => {
                const idInput = row.querySelector('.ex-id'); if(!idInput) return;
                const id = idInput.value; const name = row.querySelector('.ex-name').value;
                const marks = [];
                classSubjectConfig[cls].forEach((_, sIdx) => { const mk = row.querySelector(`.sub-mark-${sIdx}`); marks.push(mk ? mk.value.trim() : ''); });
                updatedCurrent.push({ id, name, class: cls, session: ses, exam: exm, marks });
            });
            
            excelStudents = [...otherClassStudents, ...updatedCurrent];
            try{ localStorage.setItem('m3_results', JSON.stringify(excelStudents)); }catch(e){}
            
            const updates = {}; excelStudents.forEach(item => { if(item.id) updates[item.id] = item; });
            db.ref('m3_results').set(updates).then(() => {
                renderExcelTable(); 
                if(showAlert) alert(`${cls} Results Saved Successfully! Ghost data cleaned.`);
            });
        }

                                    <th class="border border-slate-700 p-1 text-left w-36">Student Name</th>

            const cls = document.getElementById('class-result-dropdown').value;
            const ses = document.getElementById('class-session-dropdown').value;
            const exm = document.getElementById('class-exam-dropdown').value;
            const printArea = document.getElementById('printable-area');

                currentConfig.forEach((_, sIdx) => { const mVal = (s.marks && s.marks[sIdx] && String(s.marks[sIdx]).trim() !== '') ? s.marks[sIdx] : '-'; rowsHTML += `<td class="p-1 border font-medium text-slate-900">${mVal}</td>`; });
                rowsHTML += `<td class="p-1 border font-extrabold text-amber-700 bg-amber-50">${stats.total}</td><td class="p-1 border font-extrabold text-slate-900 bg-slate-100">${stats.gpa}</td><td class="p-1 border font-extrabold text-slate-900 bg-slate-100">${stats.grade}</td></tr>`;

            const sheetHTML = `

                    <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between gap-4 border-b-4 border-amber-500">

                        </div>
                        <span class="inline-block bg-amber-500 text-slate-900 px-3 py-1 rounded-lg font-black text-[11px] uppercase tracking-wide shrink-0 whitespace-nowrap">Tabulation Sheet</span>
                    </div>
                    <div class="flex flex-wrap justify-between items-center gap-2 px-6 py-2.5 bg-slate-100 border-b border-slate-300 text-xs md:text-sm font-bold text-slate-800">
                        <span>${exm}</span>
                        <span>Class: <span class="text-amber-700">${cls}</span></span>
                        <span>Session: <span class="text-amber-700">${ses}</span></span>
                        <span>Total Students: <span class="text-amber-700">${filtered.length}</span></span>
                    </div>
                    <div class="p-2 flex-grow">
                        <table class="w-full table-auto border-collapse border border-slate-800 text-[9px] md:text-[10px]"><thead>${thHTML}</thead><tbody>${rowsHTML}</tbody></table>
                    </div>
                </div>
            `;
            printArea.innerHTML = sheetHTML + `<div class="mt-4 no-print max-w-xl mx-auto"><button onclick="executeIsolatedPrint('target-tabulation-a4-node', 'landscape')" class="bg-slate-800 hover:bg-slate-900 text-amber-400 px-4 py-3.5 rounded-xl font-bold text-sm shadow-lg w-full transition"><i class="fa-solid fa-print mr-2"></i> Print Tabulation Sheet</button></div>`;
            printArea.classList.remove('hidden'); 
            printArea.scrollIntoView({ behavior: 'smooth', block: 'start' });

        async function autoFitA4Marksheet(elementId) {
            const sheet = document.getElementById(elementId);
            if (!sheet) return 1;
            sheet.style.transform = 'none'; sheet.style.height = 'auto'; 
            await document.fonts.ready;
            const images = sheet.querySelectorAll('img');
            await Promise.all(Array.from(images).map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => { img.onload = img.onerror = resolve; });
            }));
            const actualHeight = sheet.scrollHeight; const targetHeight = 1123;
            let scale = 1;
            if (actualHeight > targetHeight) { scale = (targetHeight / actualHeight) * 0.98; }
            sheet.style.height = (actualHeight > targetHeight ? actualHeight : targetHeight) + 'px';
            sheet.style.transform = `scale(${scale})`;
            return scale;
        }

        async function executeTranscriptPDFDownload(studentId, studentName) {
            const container = document.getElementById('pdf-export-container');
            const btn = event.target; const origText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Generating...';
            window.scrollTo(0, 0);
            try {
                const sheet = document.getElementById('target-transcript-a4-node');
                sheet.style.transform = 'none'; sheet.style.height = '1123px';
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                
                const opt = {
                    margin: 0, 
                    filename: `Transcript_${studentId}_${studentName.replace(/\s+/g, '_')}.pdf`,
                    image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { scale: 2, useCORS: true, windowWidth: 794, windowHeight: 1123 },
                    jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait' }
                };
                await html2pdf().set(opt).from(container).save();
            } finally { btn.innerHTML = origText; }
        }

        // UNIVERSAL PRINT ISOLATION
        function executeIsolatedPrint(targetNodeId, orientation) {
            const targetElement = document.getElementById(targetNodeId);
            if(!targetElement) return;

            if(orientation === 'portrait') { targetElement.style.transform = 'none'; targetElement.style.height = '1123px'; } 
            else { targetElement.style.transform = 'none'; targetElement.style.width = '1123px'; targetElement.style.height = '794px'; }

            const printFrame = document.getElementById('isolated-print-frame');
            const frameDoc = printFrame.contentWindow.document;
            const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');
            
            const pageCss = orientation === 'portrait' ? 
                `@page { size: A4 portrait; margin: 0mm !important; } .print-safe-wrap { width: 794px; height: 1123px; transform: scale(0.96); transform-origin: top center; margin-top: 5mm; }` :
                `@page { size: A4 landscape; margin: 0mm !important; } .print-safe-wrap { width: 1123px; height: 794px; transform: scale(0.96); transform-origin: top center; margin-top: 5mm; }`;

            frameDoc.open();
            frameDoc.write(`
                <!DOCTYPE html><html><head><title>Print Document</title>
                <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Amiri:wght@700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
                <script src="https://cdn.tailwindcss.com"><\/script>
                ${styles}
                <style>${pageCss} html, body { width: 100%; height: 100%; margin: 0 !important; padding: 0 !important; background: #fff; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; } .no-print { display: none !important; } * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }</style>
                </head><body><div class="print-safe-wrap">${targetElement.outerHTML}</div></body></html>
            `);
            frameDoc.close();
            
            setTimeout(() => { 
                printFrame.contentWindow.focus(); 
                printFrame.contentWindow.print(); 
            }, 1200);
        }

        }
        function clearAllSystemStorageWithPassword() {
            const pass = prompt('Enter Admin Password to WIPE ALL CLOUD DATA:');

                localStorage.removeItem('m3_db'); localStorage.removeItem('m3_results');
